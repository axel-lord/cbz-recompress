[package]
name = "cbz-recompress"
version = "0.1.0"
edition = "2024"
authors = ["Axel Lord"]
license = "MIT OR Apache-2.0"

[profile.release]
strip = "debuginfo"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
allow_attributes = "warn"
case_sensitive_file_extension_comparisons = "warn"
dbg_macro = "warn"
future_not_send = "warn"
missing_const_for_fn = "warn"
missing_docs_in_private_items = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
print_stderr = "warn"
print_stdout = "warn"
std_instead_of_core = "warn"
str_to_string = "warn"
todo = "warn"
unused_result_ok = "warn"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
color-eyre = "0.6.5"
env_logger = "0.11.11"
flume = "0.12.0"
image = "0.25.10"
indicatif = { version = "0.18.6", features = ["improved_unicode", "rayon", "unicode-segmentation"] }
jpegxl-rs = "0.16.0"
jxl-image-rs-integration = "0.7.4"
libc = "0.2.190"
log = { version = "0.4.34", features = ["release_max_level_info"] }
mimalloc = "0.1.52"
rayon = "1.12.0"
regex = "1.13.1"
rustc-hash = "2.1.3"
rustix = { version = "1.1.5", features = ["fs"] }
tap = "1.0.1"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"
zip = "9.0.4"
